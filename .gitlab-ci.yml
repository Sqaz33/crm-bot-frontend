stages:
  - build
  - deploy

docker-build:
  image: docker:cli
  stage: build
  variables:
    IMAGE: "$REGISTRY_URL/$PROJECT_NAME/frontend:$CI_COMMIT_REF_SLUG"
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY_URL
  script:
    - docker build --pull -t "$IMAGE" .
    - docker push "$IMAGE"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$IMAGE" "$REGISTRY_URL/$PROJECT_NAME/frontend:latest"
        docker push "$REGISTRY_URL/$PROJECT_NAME/frontend:latest"
      fi
  rules:
    - exists:
        - Dockerfile
      when: always

deploy-dev:
  stage: deploy
  tags: [deploy]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  before_script:
    - cp "$DEV_ENV_FILE" .env
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY_URL
  script:
    - docker pull "$REGISTRY_URL/$PROJECT_NAME/frontend:$CI_COMMIT_REF_SLUG"
    - docker rm -f "$PROJECT_NAME-frontend-dev" || true
    - |
      docker run -d \
        --name "$PROJECT_NAME-frontend-dev" \
        --restart always \
        --env-file .env \
        -p 127.0.0.1:5173:5173 \
        "$REGISTRY_URL/$PROJECT_NAME/frontend:$CI_COMMIT_REF_SLUG"


deploy-prod:
  stage: deploy
  tags: [deploy]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - cp "$PROD_ENV_FILE" .env
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY_URL
  script:
    - docker pull "$REGISTRY_URL/$PROJECT_NAME/frontend:$CI_COMMIT_REF_SLUG"
    - docker rm -f "$PROJECT_NAME-frontend" || true
    - |
      docker run -d \
        --name "$PROJECT_NAME-frontend" \
        --restart always \
        --env-file .env \
        -p 127.0.0.1:5173:5173 \
        "$REGISTRY_URL/$PROJECT_NAME/frontend:$CI_COMMIT_REF_SLUG"
